# Groups of the test suite. Each group runs as one task of an array job on a cluster, and
# every test file is in exactly one group (checked by runtests.jl). `tier = "quick"` marks
# the unit tests: `Pkg.test(test_args=["--tier", "quick"])` runs them alone. The full tier
# adds the physics validation and the DREAM comparisons. The groups are packed by the times
# of each file run alone, at most about 16 minutes each on a loaded node.
# A new test file goes into a group of its tier, or into a new group when it is slow.

[[group]]
name = "quick-1"
tier = "quick"
# 22.0 minutes in the probe
files = ["test_field_unknown.jl"]

