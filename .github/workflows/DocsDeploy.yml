# Builds the documentation and deploys it to GitHub Pages: the docs of dev at /dev/, a tag at
# its version. `deploydocs` in docs/make.jl pushes the build to the branch gh-pages.
name: Docs deploy

on:
  push:
    branches: [dev]
    tags: ["v*"]

# contents: write lets deploydocs push to gh-pages, actions: write lets julia-actions/cache
# delete the depot caches of earlier runs
permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      - uses: julia-actions/cache@v3
      - name: Install the documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
