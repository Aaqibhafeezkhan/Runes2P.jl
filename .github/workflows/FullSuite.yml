# The full test suite: one job per group of test/groups.toml, and a summary job over the groups.
# It runs on pull requests into dev and main that are ready for review, once a week on dev and
# by hand. A pull request into an integration branch (feat/<topic>) runs only CI.yml; the full
# suite runs there by hand (workflow_dispatch on the branch) and on its pull request into dev. A
# push to dev or main runs nothing: a pull request must be up to date with its base before the
# merge, so its run has tested the merged tree. The weekly run catches changes from outside the
# repository (new versions of packages, a new runner image) and renews the depot cache of dev,
# which the runs of pull requests restore. A pull request that changes no code
# (scripts/code_changes.jl, as in CI.yml) skips the suite, and its check "Full suite" passes
# without tests. A draft skips the suite too, and its check is named "Full suite (draft)", so
# that only a pull request that is ready gives the check the rulesets require.
name: Full suite

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# a newer commit of a pull request cancels the older run; a weekly or manual run finishes. A
# run of a draft skips the suite and has a group of its own: GitHub can create the run of a push
# made while the pull request was a draft only after the run of ready_for_review, and in one
# group that late run would cancel the suite of the ready pull request.
concurrency:
  group: ${{ format('{0}-{1}{2}', github.workflow, github.ref, github.event.pull_request.draft && '-draft' || '') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNES2P_JACOBIAN_CHUNK_SIZE: "8"
  # the target of the package images in the cached depot, as in CI.yml
  JULIA_CPU_TARGET: "x86-64-v3"
  # the pure-Julia regression values of test_regression_values.jl to 1e-13, not bit for
  # bit: a safety net for code compiled for another CPU, such as on a runner without AVX2;
  # an entry that differs is logged with its deviation, also when it passes
  RUNES2P_REGRESSION_RTOL: "1e-13"

jobs:
  # whether the pull request changes code, the same job as in CI.yml; a weekly or manual run
  # changes code. After a failure of this job the groups are skipped, and the check
  # "Full suite" fails.
  changes:
    name: Code changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        if: github.event_name == 'pull_request'
        with:
          version: "1.13.1"
      - name: Classify the changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            julia scripts/code_changes.jl "origin/$BASE"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # the indices 1 to n of the groups of test/groups.toml, for the matrix, and the ADAS cache,
  # filled once here for all groups
  setup:
    name: Test groups
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped' &&
      needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      indices: ${{ steps.groups.outputs.indices }}
    steps:
      - uses: actions/checkout@v7
      - name: Count the groups
        id: groups
        run: |
          python3 -c "import json, tomllib; n = len(tomllib.load(open('test/groups.toml', 'rb'))['group']); print('indices=' + json.dumps(list(range(1, n + 1))))" >> "$GITHUB_OUTPUT"
      # the OpenADAS ADF11 files, which the repository does not carry: the high-density hydrogen
      # files from the cache of DREAM's repository at the commit that the code cites, the other
      # files from OpenADAS
      - name: Restore the ADAS cache
        id: adas
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Runes2P/adas
          key: adas-${{ hashFiles('scripts/fetch_adas.py') }}
          lookup-only: true
      - name: Check out the ADAS cache of DREAM
        if: steps.adas.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: chalmersplasmatheory/DREAM
          ref: 93d27e1763827e19dafb1fe790e99c2688ad6d62
          path: dream-adas
          sparse-checkout: tools/cache
      - name: Fill the ADAS cache
        if: steps.adas.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_adas.py --cache "$HOME/.cache/Runes2P/adas" --dream-cache dream-adas/tools/cache
      - name: Save the ADAS cache
        if: steps.adas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Runes2P/adas
          key: adas-${{ hashFiles('scripts/fetch_adas.py') }}

  # one group, run with --index at the default optimisation level, where the allocation
  # checks and the stored regression values hold
  groups:
    name: Group ${{ matrix.index }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # actions: write lets julia-actions/cache delete the depot caches of earlier runs
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.setup.outputs.indices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      # the CPU and the LLVM target of the runner, for results whose last bits depend on them
      - name: Name the CPU
        run: julia -e 'using InteractiveUtils; versioninfo()'
      # one depot cache for all groups, which share the test environment
      - uses: julia-actions/cache@v3
        with:
          # the target in the name: images of another target are never restored
          cache-name: julia-cache-${{ env.JULIA_CPU_TARGET }};workflow=${{ github.workflow }};job=${{ github.job }}
          include-matrix: false
      - name: Set the ADAS cache directory
        run: echo "RUNES2P_ADAS_CACHE=$HOME/.cache/Runes2P/adas" >> "$GITHUB_ENV"
      - name: Restore the ADAS cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Runes2P/adas
          key: adas-${{ hashFiles('scripts/fetch_adas.py') }}
          fail-on-cache-miss: true
      # the test environment and the reference data of the comparison tests (lazy artifacts,
      # kept in the cached depot)
      - name: Install the test environment
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.Artifacts.ensure_all_artifacts_installed("test/Artifacts.toml"; include_lazy=true)'
      - name: Run the group
        run: julia --project=test test/runtests.jl --index ${{ matrix.index }} --results "results/group-${{ matrix.index }}.toml"
      - name: Upload the summary of the group
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.index }}
          path: results/
          if-no-files-found: ignore

  # the result of the suite as one check, with a table of the counts of every group. The job
  # runs in every run: GitHub evaluates the expression of a job's name only when the job runs,
  # and a skipped job would report its check under the text of the expression, never under the
  # name "Full suite" that the rulesets require. It passes without tests on a pull request
  # that changes no code and on a draft. A draft's check has another name, so that it never
  # reads as the check of the ready pull request on the same commit. In every other run, a
  # cancelled one or one whose job "Code changes" failed among them, it passes only when every
  # group passed.
  summary:
    name: ${{ github.event.pull_request.draft && 'Full suite (draft)' || 'Full suite' }}
    needs: [changes, setup, groups]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report a pull request that changes no code
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'false'
        run: |
          echo "No file changes code: the suite did not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Report a draft
        if: github.event.pull_request.draft == true
        run: |
          echo "A draft: the suite did not run. It runs once the pull request is ready." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: needs.setup.result == 'success'
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Write the table of the groups
        if: needs.setup.result == 'success'
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, tomllib
          print("| Group | Passed | Failed | Errored | Broken | Minutes |")
          print("|---|---|---|---|---|---|")
          for path in sorted(glob.glob("results/*.toml"), key=lambda p: int(p.split("-")[-1].split(".")[0])):
              r = tomllib.load(open(path, "rb"))
              print(f"| {r['label']} | {r['passed']} | {r['failed']} | {r['errored']} | {r['broken']} | {r['elapsed_seconds'] / 60:.1f} |")
          EOF
      # the one decision of the check, in every run: it passes on a draft, on a pull request
      # that changes no code, or when every group passed, and fails in every other case
      - name: Decide the result of the suite
        if: always()
        env:
          DRAFT: ${{ github.event.pull_request.draft == true }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          SETUP_RESULT: ${{ needs.setup.result }}
          GROUPS_RESULT: ${{ needs.groups.result }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "a draft: the suite did not run"
          elif [ "$CHANGES_RESULT" = "success" ] && [ "$CHANGES_CODE" = "false" ]; then
            echo "no file changes code: the suite did not run"
          elif [ "$GROUPS_RESULT" = "success" ]; then
            echo "every group of the full suite passed"
          else
            echo "the full suite did not pass: Code changes $CHANGES_RESULT (code '$CHANGES_CODE'), Test groups $SETUP_RESULT, groups $GROUPS_RESULT"
            exit 1
          fi
