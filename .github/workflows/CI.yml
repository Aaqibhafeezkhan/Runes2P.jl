# The checks of every pull request, drafts included, and of every push to dev and main: the
# markdown lint, the code style check, the format check, the component tests and the strict
# documentation build. A pull request that changes no code (scripts/code_changes.jl: markdown,
# docs/src/, and Julia files outside test/ whose code is the same without docstrings and
# comments) skips the component tests; a skipped job counts as passed for the required checks.
# A push to another branch runs nothing, since its pull request runs the same checks. The full
# suite is in FullSuite.yml.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# a newer commit of a pull request cancels the older run; pushes to dev and main each finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNES2P_JACOBIAN_CHUNK_SIZE: "8"
  # one target for the package images of the cached depot on every runner (AVX2 and FMA), so
  # that an image restored from another runner holds the same code; a runner without AVX2
  # rejects it and compiles its own. Code compiled during a run targets the runner's CPU.
  JULIA_CPU_TARGET: "x86-64-v3"

jobs:
  # whether the pull request changes code; a push changes code. The job is the same in
  # FullSuite.yml. A failure of this job leaves the output empty, and the jobs that read it
  # run.
  changes:
    name: Code changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        if: github.event_name == 'pull_request'
        with:
          version: "1.13.1"
      - name: Classify the changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            julia scripts/code_changes.jl "origin/$BASE"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # the markdown rules of CONTRIBUTING.md: the lines a pull request changes, or every tracked
  # markdown file on a push
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint the changed lines of the pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/lint_markdown.py --base "origin/${{ github.base_ref }}"
      - name: Lint every tracked markdown file
        if: github.event_name != 'pull_request'
        run: git ls-files -z -- '*.md' | xargs -0 python3 scripts/lint_markdown.py

  # the patterns of "Code style" in CONTRIBUTING.md that a script can decide, in the Julia files
  # of src/ and ext/: the lines a pull request adds, or every line of these files on a push
  style:
    name: Code style check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the added lines of the pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_code_style.py --base "origin/${{ github.base_ref }}"
      - name: Check every tracked Julia file of src/ and ext/
        if: github.event_name != 'pull_request'
        run: git ls-files -z -- "src/*.jl" "ext/*.jl" | xargs -0 python3 scripts/check_code_style.py

  # the format check: JuliaFormatter 2.14.0 with the .JuliaFormatter.toml of the root changes
  # nothing; format(".") of that version formats a checkout. The step formats the checkout of
  # the run and fails with the files and lines that changed.
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      - name: Check the format
        run: |
          julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2.14.0"); using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            git diff -z --name-only | while IFS= read -r -d '' file; do
              echo "::error file=$file::not formatted: run JuliaFormatter 2.14.0, format(\".\") at the root"
            done
            git diff --stat
            git diff
            exit 1
          fi

  # the group `component` of test/groups.toml at -O0, which compiles faster; skipped when the
  # pull request changes no code
  component:
    name: Component tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # actions: write lets julia-actions/cache delete the depot caches of earlier runs
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      # the CPU and the LLVM target of the runner, for results whose last bits depend on them
      - name: Name the CPU
        run: julia -e 'using InteractiveUtils; versioninfo()'
      - uses: julia-actions/cache@v3
        with:
          # the target in the name: images of another target are never restored
          cache-name: julia-cache-${{ env.JULIA_CPU_TARGET }};workflow=${{ github.workflow }};job=${{ github.job }}
      # the OpenADAS ADF11 files, which the repository does not carry: the high-density hydrogen
      # files from the cache of DREAM's repository at the commit that the code cites, the other
      # files from OpenADAS; a fresh fill is saved at once, so that a failing test keeps it
      - name: Set the ADAS cache directory
        run: echo "RUNES2P_ADAS_CACHE=$HOME/.cache/Runes2P/adas" >> "$GITHUB_ENV"
      - name: Restore the ADAS cache
        id: adas
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Runes2P/adas
          key: adas-${{ hashFiles('scripts/fetch_adas.py') }}
      - name: Check out the ADAS cache of DREAM
        if: steps.adas.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: chalmersplasmatheory/DREAM
          ref: 93d27e1763827e19dafb1fe790e99c2688ad6d62
          path: dream-adas
          sparse-checkout: tools/cache
      - name: Fill the ADAS cache
        if: steps.adas.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_adas.py --cache "$RUNES2P_ADAS_CACHE" --dream-cache dream-adas/tools/cache
      - name: Save the ADAS cache
        if: steps.adas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Runes2P/adas
          key: adas-${{ hashFiles('scripts/fetch_adas.py') }}
      # installed at the optimisation level of the run, so that the precompiled files serve it
      - name: Install the test environment
        run: julia -O0 --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Run the component tests
        run: julia -O0 --project=test test/runtests.jl component

  # the strict build of the documentation; it deploys nothing, and it does not run where
  # DocsDeploy.yml builds the same commit (pushes to dev)
  docs:
    name: Documentation build
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: write lets julia-actions/cache delete the depot caches of earlier runs
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      - uses: julia-actions/cache@v3
        with:
          # the target in the name: images of another target are never restored
          cache-name: julia-cache-${{ env.JULIA_CPU_TARGET }};workflow=${{ github.workflow }};job=${{ github.job }}
      - name: Install the documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build the documentation
        run: julia --project=docs docs/make.jl
